.page{padding:24px 28px}
.stats{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap}

.search-wrap{position:relative;flex:1;min-width:180px}

input[type=text]{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:7px;color:#e8eaf0;font-size:13px;padding:7px 10px 7px 30px;outline:none;font-family:inherit;transition:border-color .15s}

.fpills{display:flex;gap:4px;flex-wrap:wrap}

.rc{font-size:11px;color:#374151;margin-left:auto}

table{width:100%;border-collapse:collapse;min-width:1800px}

tbody tr:hover td{background:rgba(99,102,241,.04)}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.008)}
td{padding:10px 13px;font-size:13px;color:#c4c9d8;border-bottom:1px solid rgba(255,255,255,.035);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
.tbl-foot{padding:9px 14px;border-top:1px solid rgba(255,255,255,.04);display:flex;justify-content:space-between}
.tbl-foot span{font-size:11px;color:#1f2130}

.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

// ── CSV PARSER ────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = [];
  let cur = '', inQ = false;
  const cells = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') { inQ = !inQ; }
    else if (ch === ',' && !inQ) { cells.push(cur); cur = ''; }
    else if ((ch === '\n' || ch === '\r') && !inQ) {
      cells.push(cur); cur = '';
      if (cells.some(c=>c)) lines.push([...cells]);
      cells.length = 0;
      if (ch === '\r' && text[i+1] === '\n') i++;
    } else { cur += ch; }
  }
  if (cur || cells.length) { cells.push(cur); if (cells.some(c=>c)) lines.push([...cells]); }
  return lines;
}

function csvToRows(lines) {
  // Skip header rows (first 2 lines are header + separator or just header)
  const start = lines.findIndex(l => l[0] && !l[0].toLowerCase().includes('opp') && !l[0].startsWith(':'));
  const data = lines.slice(start < 0 ? 1 : start);
  const bool = v => /^true$/i.test(v);
  return data
    .filter(c => c[COL.d] && c[COL.d].trim())
    .map(c => ({
      d:    c[COL.d]?.trim()   || '',
      s:    c[COL.s]?.trim()   || '',
      dl:   c[COL.dl]?.trim()  || '',
      aa:   bool(c[COL.aa]),
      w:    c[COL.w]?.trim()   || '',
      pr:   c[COL.pr]?.trim()  || '',
      paid: bool(c[COL.paid]),
      t:    c[COL.t]?.trim()   || '',
      cit:  c[COL.cit]?.trim() || '',
      da:   c[COL.da]?.trim()  || '',
      rp:   c[COL.rp]?.trim()  || '',
      p:    c[COL.p]?.trim()   || '',
      snip: c[COL.snip]?.trim()|| '',
      tl:   c[COL.tl]?.trim()  || '',
      cpub: c[COL.cpub]?.trim()|| '',
      fb:   '',
    }));
}

      <td>
        <div class="drop-wrap">
          <span class="badge" style="background:${m.bg};color:${m.col};border-color:${m.dot}33" data-i="${r._i}">
            <span class="dot${r.s==='Live'?' dot-live':''}" style="background:${m.dot}"></span>
            ${e(r.s)}
            <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="opacity:.5"><polyline points="6 9 12 15 18 9"/></svg>
          </span>
        </div>
      </td>
      <td style="font-size:11px;color:#4b5563;white-space:nowrap">${e(r.dl)||'—'}</td>
      <td style="text-align:center">${r.aa ? '<span class="bool-yes">✓</span>' : '<span class="bool-no">—</span>'}</td>
      <td style="font-weight:600;color:#f0f1f8;white-space:nowrap">${e(r.w)}</td>
      <td style="font-size:12px;color:#a8b3cf;max-width:180px">${e(r.pr)||'—'}</td>
      <td style="text-align:center">${r.paid ? '<span class="bool-yes">✓</span>' : '<span class="bool-no">—</span>'}</td>
      <td>${r.t ? `<span class="type-pill ${tc}">${e(r.t)}</span>` : '—'}</td>
      <td>${r.cit ? `<a href="${e(r.cit)}" target="_blank" class="cit"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Visit</a>` : '—'}</td>
      <td style="text-align:center">${da}</td>
      <td style="font-size:12px;color:#a5b4fc;white-space:nowrap">${e(r.rp)||'—'}</td>
      <td>${hasPrice ? `<span class="price-yes">${e(r.p)}</span>` : '<span class="price-no">—</span>'}</td>
      <td>${snipHtml}</td>
      <td>${r.tl ? `<a href="${e(r.tl)}" target="_blank" class="cit" style="max-width:130px;overflow:hidden;text-overflow:ellipsis">${trunc(r.tl,30)}</a>` : '<span style="color:#1f2540;font-size:12px">—</span>'}</td>
      <td>${copyCell(r.cpub, 'copy')}</td>
      <td data-i="${r._i}"><div class="fb" onclick="editFb(this,${r._i})">${fb}</div></td>
    </tr>`;
  }).join('') : `<tr><td colspan="${COLS.length}" style="padding:44px;text-align:center;color:#1f2540;font-size:13px">No rows match your filters</td></tr>`;

  document.querySelectorAll('.badge').forEach(b =>
    b.addEventListener('click', ev => { ev.stopPropagation(); openDrop(b); })
  );
}

// ── COPY CELL (snippet / copy from publisher) ─────────────────────────────────
function copyCell(text, label) {
  if (!text) return '<span style="color:#1f2540;font-size:12px">—</span>';
  const LIMIT = 80;
  const preview = text.length > LIMIT ? text.slice(0, LIMIT) + '…' : text;
  return `<div class="copy-cell" onclick="copyText(this,'${e(text).replace(/'/g,'&#39;')}')">
    <span class="copy-hint">Click to copy</span>
    <span>${e(preview)}</span>
    <div class="copy-full">${e(text)}</div>
  </div>`;
}

// ── DROPDOWN ──────────────────────────────────────────────────────────────────
function openDrop(badge) {
  closeDrop();
  const i = parseInt(badge.dataset.i);
  const cur = ROWS[i].s;
  const wrap = badge.closest('.drop-wrap');
  const d = document.createElement('div');
  d.className = 'dropdown';
  d.innerHTML = ALL_S.map(s => {
    const m = sm(s);
    return `<div class="di${s===cur?' cur':''}" data-s="${s}" data-i="${i}" style="${s===cur?`color:${m.col}`:''}">
      <span class="dot" style="background:${m.dot}"></span>${s}${s===cur?'<span class="di-check">✓</span>':''}
    </div>`;
  }).join('');
  d.querySelectorAll('.di').forEach(item => item.addEventListener('click', ev => {
    ev.stopPropagation();
    ROWS[parseInt(item.dataset.i)].s = item.dataset.s;
    persist(); renderStats(); buildStatusPills(); render(); closeDrop();
    showToast('Status updated');
  }));
  wrap.appendChild(d);
  setTimeout(()=>document.addEventListener('click', closeDrop), 10);
}
function closeDrop() {
  document.querySelectorAll('.dropdown').forEach(d=>d.remove());
  document.removeEventListener('click', closeDrop);
}

// ── FEEDBACK ──────────────────────────────────────────────────────────────────
function editFb(div, i) {
  const ta = document.createElement('textarea');
  ta.className = 'fb-ta';
  ta.value = ROWS[i].fb || '';
  ta.placeholder = 'Add a note… (Enter to save, Esc to cancel)';
  div.replaceWith(ta);
  ta.focus();
  const save = () => { ROWS[i].fb = ta.value.trim(); persist(); render(); showToast('Saved'); };
  ta.addEventListener('keydown', ev => {
    if (ev.key==='Enter'&&!ev.shiftKey) { ev.preventDefault(); save(); }
    if (ev.key==='Escape') render();
  });
  ta.addEventListener('blur', save);
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function copyText(el, text) {
  navigator.clipboard.writeText(text).then(() => {
    const hint = el.querySelector('.copy-hint');
    if (hint) { hint.textContent = 'Copied!'; setTimeout(()=>{ hint.textContent='Click to copy'; },1500); }
    showToast('Copied to clipboard');
  }).catch(()=>{ showToast('Copy failed'); });
}
const e = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const trunc = (s,n) => s&&s.length>n ? s.slice(0,n)+'…' : (s||'');
let tt;
function showToast(msg) {
  const el=document.getElementById('toast');
  el.textContent='✓ '+msg; el.className='toast t-ok'; el.style.display='block';
  clearTimeout(tt); tt=setTimeout(()=>el.style.display='none',2000);
}

document.addEventListener('click', ev => { if(!ev.target.closest('.drop-wrap')) closeDrop(); });
init();
</script>
</body>
</html>
